name: Nix Lint

on:
  push:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "Justfile"
      - "scripts/**"
      - ".github/workflows/nix-lint.yml"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # gitleaks の全履歴スキャンのため fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/distrust-emudhra

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - uses: DeterminateSystems/flake-checker-action@v14

      - name: CI check
        run: nix develop --command just ci

      - name: Secret scan (full history)
        run: nix develop --command gitleaks git --no-banner
